<!DOCTYPE html>
<html>

<head>
    <title>Historial de Liquidaciones de Compra</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/compras.css') }}">
</head>

<body>

<div class="header">

    <h1>📋 HISTORIAL DE LIQUIDACIONES</h1>

</div>

<div class="subcard">

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Proveedor</th>
                <th>Importe Total</th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>

            {% for l in liquidaciones %}

            <tr>

                <td>{{ l[0] }}</td>
                <td>{{ l[1] }}</td>
                <td>{{ l[2] }}</td>
                <td>{{ l[3] }}</td>

                <td>

                    <a href="/ver_liquidacion/{{ l[0] }}">
                        Ver Detalle
                    </a>

                    <br><br>

                    <a href="/eliminar_liquidacion/{{ l[0] }}"
                       onclick="return confirm('¿Eliminar liquidación?')">
                        Eliminar
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

<div class="subcard" style="text-align:center;">

    <button onclick="window.location.href='/'">
        🏠 Volver al Inicio
    </button>

</div>

</body>

</html>
